# A paid native Python service. Supply an external Gemma 3 endpoint.
# Do not run local Ollama on the web service's small instance.
services:
  - type: web
    name: gramask
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /readyz
    disk:
      name: gramask-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: SECURE_COOKIES
        value: "1"
      - key: DB_PATH
        value: /var/data/gramask.db
      - key: DEMO_MODE
        value: "0"
      - key: ALLOW_FALLBACK
        value: "0"
      - key: LIVE_FRESHNESS_MIN
        value: "5"
      - key: QUESTION_ROUTING
        value: knowledge_first
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT
        value: "120"
      - key: QUORUM
        value: "3"
      - key: AGREEMENT
        value: "0.6"
