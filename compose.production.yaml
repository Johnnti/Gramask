name: gramask-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      web:
        ipv4_address: ${PROXY_IP:-172.30.180.2}
    depends_on:
      app:
        condition: service_started
    logging: *logging

  app:
    image: gramask-production:${RELEASE_TAG:-local}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "${PROXY_IP:-172.30.180.2}", "--no-server-header"]
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      SECURE_COOKIES: "1"
      DB_PATH: /app/data/gramask.db
      DEMO_MODE: "0"
      DEMO_BROADCAST_ALL: "0"
      ALLOW_FALLBACK: "0"
      QUESTION_ROUTING: ${QUESTION_ROUTING:-community}
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      LLM_MAX_CONCURRENT: "1"
      QUORUM: ${QUORUM:-3}
      AGREEMENT: ${AGREEMENT:-0.6}
      TIMEOUT_MIN: ${TIMEOUT_MIN:-30}
      FACT_TTL_HOURS: ${FACT_TTL_HOURS:-2}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      ASK_RATE_LIMIT: ${ASK_RATE_LIMIT:-10}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
    volumes:
      - app-data:/app/data
    networks:
      - web
      - model
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      pull-model:
        condition: service_completed_successfully
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - model-data:/root/.ollama
    networks: [model]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  pull-model:
    image: ollama/ollama:0.40.13
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${LLM_MODEL:-gemma3:4b}"]
    networks: [model]
    depends_on:
      ollama:
        condition: service_healthy
    logging: *logging

networks:
  web:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.180.0/24}
  model:

volumes:
  app-data:
  model-data:
  caddy-data:
  caddy-config:
